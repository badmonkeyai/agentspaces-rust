name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, the test suite, and the API docs, on Linux and macOS,
  # with the toolchain rust-toolchain.toml pins.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # The cross-language suites (the peer, aspace, and the MCP gateway
        # against the Java reference node, and example 32) need a JDK 21,
        # Maven, and the AgentSpaces 0.5.0 Java artifacts in the local Maven
        # repository, which they resolve offline. A runner has no such
        # artifacts, so each of those tests says why it skips and passes here.
        # They run where the 0.5.0 artifacts are available; set
        # ASPACE_INTEROP_REQUIRED=1 there to make a skip fail.
        run: cargo test --workspace --locked
      - name: API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # The dependency policy of deny.toml: advisories, licences, duplicate
  # versions (warnings only), and sources (crates.io only).
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked check
