[package]
name = "agentspaces-pdt"
description = "Persistent data trees for AgentSpaces in Rust: refs over the content swarm, and the file share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["agents", "p2p", "persistent", "crdt", "content-addressed"]
categories = ["network-programming", "asynchronous", "data-structures"]

[dependencies]
agentspaces = { version = "0.5.0", path = "../agentspaces" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
