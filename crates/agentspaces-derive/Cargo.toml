[package]
name = "agentspaces-derive"
description = "The #[derive(Entry)] macro of AgentSpaces for Rust: binds a type to its wire schema name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["agents", "derive", "agentspaces"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true

[dev-dependencies]
agentspaces = { path = "../agentspaces" }
serde = { version = "1.0.229", features = ["derive"] }
trybuild = "1.0.122"
