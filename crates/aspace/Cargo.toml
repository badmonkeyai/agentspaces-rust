[package]
name = "aspace"
description = "The aspace command: a fleet member for scripts, hooks, and shells (AgentSpaces for Rust)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["agents", "cli", "mcp", "p2p", "ai"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "aspace"
path = "src/main.rs"

[dependencies]
agentspaces = { version = "0.5.0", path = "../agentspaces" }
agentspaces-mcp = { version = "0.5.0", path = "../agentspaces-mcp", default-features = false }
clap = { version = "4.6.7", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
