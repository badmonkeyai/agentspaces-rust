[package]
name = "agentspaces-wire"
description = "The AgentSpaces protocol core for Rust: wire version 3 frames, identities, records, and the space fold, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["agents", "p2p", "cbor", "protocol", "tuple-space"]
categories = ["network-programming", "encoding"]

[dependencies]
ed25519-dalek = "3"
getrandom = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
