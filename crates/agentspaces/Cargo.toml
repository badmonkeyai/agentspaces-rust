[package]
name = "agentspaces"
description = "AgentSpaces for Rust: join a peer-to-peer fleet of agents, share a replicated space, take work, and call other agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["agents", "p2p", "multi-agent", "tuple-space", "ai"]
categories = ["network-programming", "asynchronous"]

[dependencies]
agentspaces-derive = { version = "0.5.0", path = "../agentspaces-derive" }
agentspaces-wire = { version = "0.5.0", path = "../agentspaces-wire" }
base64 = "0.23.1"
futures-core = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_bytes = "0.11.19"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = "0.26"
tracing = "0.1.44"
x509-parser = "0.18"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
# flock of the keystore directory at its first use (keystore::load_or_create).
rustix = { version = "1.1.6", features = ["fs"] }

[lints]
workspace = true

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "test-util"] }
