[package]
name = "rust-fleet"
description = "Example 32: a Rust worker, an aspace work script, and an aspace call on example 02's research fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rust-worker"
path = "src/main.rs"

[dependencies]
agentspaces = { version = "0.5.0", path = "../../crates/agentspaces" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
